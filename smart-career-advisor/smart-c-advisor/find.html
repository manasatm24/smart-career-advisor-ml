  <!-- Find a Career Section -->
    <section id="find" class="section career-find-section">
        <h2>Find Your Perfect Career Path 🚀</h2>
        <p>Answer a few questions about your background and skills to receive personalized suggestions.</p>

        <form id="careerForm" class="career-form">

            <!-- Academic Branch -->
            <div class="form-group">
                <label for="branch"><i class="fas fa-university"></i> Academic Branch:</label>
                <select id="branch" required>
                    <option value="">-- Select Your Branch --</option>
                    <option value="CSE">CSE (Computer Science)</option>
                    <option value="ISE">ISE (Information Science)</option>
                    <option value="BCA">BCA (Computer Applications)</option>
                    <option value="BSC">BSc (Computer Science / IT)</option>
                    <option value="ECE">ECE (Electronics & Communication)</option>
                    <option value="EEE">EEE (Electrical & Electronics)</option>
                    <option value="ME">ME (Mechanical)</option>
                    <option value="CIVIL">Civil Engineering</option>
                    <option value="AIML">AI & ML</option>
                    <option value="DS">Data Science</option>
                    <option value="BIO">Biotechnology</option>
                    <option value="AUTO">Automobile Engineering</option>
                </select>
            </div>

            <!-- Interested Skills -->
            <div class="form-group">
                <label><i class="fas fa-lightbulb"></i> Interested Skills:</label>
                <div class="radio-group small">
                    <label><input type="checkbox" name="interestedSkill" value="AI/ML"> AI/ML</label>
                    <label><input type="checkbox" name="interestedSkill" value="Data Science"> Data Science</label>
                    <label><input type="checkbox" name="interestedSkill" value="Web Development"> Web Development</label>
                    <label><input type="checkbox" name="interestedSkill" value="Cybersecurity"> Cybersecurity</label>
                    <label><input type="checkbox" name="interestedSkill" value="Cloud Computing"> Cloud Computing</label>
                    <label><input type="checkbox" name="interestedSkill" value="App Development"> App Development</label>
                    <label><input type="checkbox" name="interestedSkill" value="Data Analytics"> Data Analytics</label>
                    
                </div>
            </div>


          


            <!-- Already Learned Skills -->
            <div class="form-group">
                <label><i class="fas fa-graduation-cap"></i> Already Learned Skills:</label>
                <div class="radio-group small">
                    <label><input type="checkbox" name="learnedSkill" value="Python"> Python</label>
                    <label><input type="checkbox" name="learnedSkill" value="Java"> Java</label>
                    <label><input type="checkbox" name="learnedSkill" value="C++"> C++</label>
                    <label><input type="checkbox" name="learnedSkill" value="HTML/CSS"> HTML/CSS</label>
                    <label><input type="checkbox" name="learnedSkill" value="JavaScript"> JavaScript</label>
                    <label><input type="checkbox" name="learnedSkill" value="SQL"> SQL</label>
                    <label><input type="checkbox" name="learnedSkill" value="React"> React</label>
                    <label><input type="checkbox" name="learnedSkill" value="Node.js"> Node.js</label>
                    <label><input type="checkbox" name="learnedSkill" value="AI/ML"> AI/ML</label>
                   
                </div>
            </div>

            <!-- Experience Type -->
            <div class="form-group">
                <label><i class="fas fa-briefcase"></i> Are you a Fresher or Experienced?</label>
                <div class="radio-group">
                    <label><input type="radio" name="expType" value="Fresher" checked> Fresher</label>
                    <label><input type="radio" name="expType" value="Experienced"> Experienced</label>
                </div>
            </div>

            <!-- Years of Experience (hidden initially) -->
            <div class="form-group hidden" id="yearsGroup">
                <label for="years"><i class="fas fa-calendar-alt"></i> Years of Experience:</label>
                <input type="number" id="years" min="1" max="40" placeholder="Enter years of experience">
            </div>

            <!-- Preferred Role -->
            <div class="form-group">
                <label for="preferredRole">Preferred Role (Optional):</label>
                <select id="preferredRole" name="preferredRole">
                    <option value="">-- Select a Role --</option>
                    <option value="Software Developer">Software Developer</option>
                    <option value="Data Analyst">Data Analyst</option>
                    <option value="Cybersecurity Analyst">Cybersecurity Analyst</option>
                    <option value="Cloud Engineer">Cloud Engineer</option>
                    <option value="Web Developer">Web Developer</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="System Administrator">System Administrator</option>
                </select>
            </div>

            <!-- Preferred Location -->
            <div class="form-group">
                <label for="preferredLocation">Preferred Location (Optional):</label>
                <select id="preferredLocation" name="preferredLocation">
                    <option value="">-- Select a Location --</option>
                    <option value="Bengaluru">Bengaluru</option>
                    <option value="Berlin">Berlin</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Gurgaon">Gurgaon</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="London">London</option>
                    <option value="New York">New York</option>
                    <option value="Noida">Noida</option>
                    <option value="Pune">Pune</option>
                    <option value="Remote">Remote</option>
                    <option value="San Francisco">San Francisco</option>
                    <option value="Seattle">Seattle</option>
                    <option value="Toronto">Toronto</option>
                </select>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn primary submit-btn">Get Recommendations</button>
        </form>
    </section>

    <!-- Results Section -->
    <section id="resultsSection" class="section results-section hidden">
        <div id="careerResults"></div>
        <hr class="results-divider">
        <div id="jobResults"></div>
    </section>
