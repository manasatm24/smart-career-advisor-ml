<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Smart Career Advisor</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-card">
    <div class="auth-brand">Smart Career Advisor</div>
    <p class="auth-subtitle">Login to access your working dashboard.</p>

    <input class="auth-input" type="text" id="username" placeholder="Username">
    <input class="auth-input" type="password" id="password" placeholder="Password">

    <button class="auth-button" onclick="login()">Login</button>

    <p id="result" class="auth-message"></p>
    <p class="form-footer">New here? <a href="register.html">Create a free account</a></p>
</div>

<script src="login.js"></script>

</body>
</html>
