<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logout - Smart Career Advisor</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-card">
        <div class="auth-brand">Logged Out</div>
        <p class="auth-subtitle">You've successfully signed out of Smart Career Advisor.</p>

        <p id="logoutMessage" class="auth-message auth-success">Signing out...</p>
        <button class="auth-button" onclick="goToLogin()">Go to Login</button>
        <p class="form-footer"><a href="login.html">Return to Login</a></p>
    </div>

    <script src="logout.js"></script>
</body>
</html>
