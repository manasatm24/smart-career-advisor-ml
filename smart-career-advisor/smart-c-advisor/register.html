<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Smart Career Advisor</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-card">
        <div class="auth-brand">Smart Career Advisor</div>
        <p class="auth-subtitle">Create your account and access career guidance.</p>

        <input class="auth-input" type="text" id="username" placeholder="Username">
        <input class="auth-input" type="email" id="email" placeholder="Email">
        <input class="auth-input" type="password" id="password" placeholder="Password">
        <input class="auth-input" type="password" id="confirmPassword" placeholder="Confirm Password">

        <button class="auth-button" onclick="registerUser()">Register</button>
        <p id="result" class="auth-message"></p>
        <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="register.js"></script>
</body>
</html>
